
<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRONE.IO v7.4</title><style>
html,body{margin:0;overflow:hidden;background:#f2f4f6;font-family:Arial,sans-serif}canvas{display:block}.panel{position:fixed;background:rgba(255,255,255,.93);border:1px solid #ccd2d8;border-radius:10px;padding:9px 11px;font-size:13px;color:#19202a;box-shadow:0 2px 8px #0001}.left{top:12px;left:12px;width:220px}.right{top:12px;right:12px;min-width:170px}.bottom{bottom:12px;left:50%;transform:translateX(-50%)}.map{right:12px;bottom:12px;padding:6px}#join{position:fixed;inset:0;display:grid;place-items:center;background:#e9edf1;z-index:10}#joinbox{background:white;padding:24px;border-radius:14px;border:1px solid #ccd2d8;text-align:center;width:min(360px,80vw)}input,button{font-size:16px;padding:10px;border-radius:8px;border:1px solid #bbc3cc}button{cursor:pointer;background:#202938;color:white}.bar{height:8px;background:#dce1e6;border-radius:4px;overflow:hidden;margin-top:4px}.fill{height:100%}.hp{background:#ef5350}.en{background:#42a5f5}.xp{background:#ab47bc}.small{color:#68717c;font-size:12px}.stats{display:grid;grid-template-columns:60px 1fr;gap:4px 7px;margin-top:7px}.cells{display:flex;gap:2px}.cell{width:12px;height:7px;background:#d8dde3;border-radius:2px}.cell.on{background:#66717e}#mini{width:170px;height:110px;display:block;background:#d9dde1;border-radius:6px}</style></head><body>
<div id="join"><div id="joinbox"><h2 id="joinTitle">DRONE.IO v7.5</h2><p id="joinSub">아이템 파밍 + 레벨업 멀티플레이</p><input id="name" maxlength="16" placeholder="닉네임" value="Player"><button id="go">PLAY</button><p class="small">WASD 이동 · 클릭 발사 · Q 폭탄 · E 포션 · R 레이저 · SPACE 부스트</p></div></div>
<canvas id="c"></canvas>
<div class="panel left"><b id="status">연결 중...</b><div>Lv.<b id="lvl">1</b>　🪙 <span id="coins">0</span>　💣 <span id="bombs">0</span>　🧪 <span id="pots">0</span>　🔴 <span id="lasers">0</span></div><div>HP<div class="bar"><div id="hp" class="fill hp"></div></div></div><div>BOOST<div class="bar"><div id="en" class="fill en"></div></div></div><div>XP <span id="xptext"></span><div class="bar"><div id="xp" class="fill xp"></div></div></div><div class="stats"><span>공격력</span><div id="atk" class="cells"></div><span>연사</span><div id="rof" class="cells"></div><span>이속</span><div id="spd" class="cells"></div></div><div id="laserState" class="small"></div></div>
<div class="panel right"><b>LEADERBOARD</b><div id="board"></div></div>
<div class="panel map"><canvas id="mini" width="170" height="110"></canvas></div>
<div class="panel bottom">WASD · CLICK · Q 폭탄(30) · E 포션 · R 레이저(15초) · SPACE 부스트(3초)</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),mini=document.getElementById('mini'),mctx=mini.getContext('2d');function rs(){c.width=innerWidth;c.height=innerHeight}addEventListener('resize',rs);rs();
let ws,myId=null,dead=false,state={world:{w:2800,h:1800},players:[],bots:[],wilds:[],bullets:[],pickups:[],grenades:[]},keys={},mouse={x:innerWidth/2,y:innerHeight/2,down:false},playing=false,lastShoot=0;
const $=id=>document.getElementById(id);$('go').onclick=()=>{if(dead&&ws&&ws.readyState===1){ws.send(JSON.stringify({t:'respawn'}));return;}connect($('name').value||'Player');$('join').style.display='none';playing=true;c.focus()};
function connect(name){const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(proto+'://'+location.host);ws.onopen=()=>{$('status').textContent='ONLINE';ws.send(JSON.stringify({t:'name',name}))};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.t==='welcome'){myId=m.id;state.world=m.world;dead=false}if(m.t==='state')state=m;if(m.t==='dead'){dead=true;playing=false;$('joinTitle').textContent='YOU DIED';$('joinSub').textContent='Lv.'+(m.stats?.level||1)+' · SCORE '+(m.stats?.score||0)+' · COIN '+(m.stats?.coins||0);$('go').textContent='PLAY AGAIN';$('join').style.display='grid'}if(m.t==='respawned'){dead=false;playing=true;$('joinTitle').textContent='DRONE.IO v7.5';$('joinSub').textContent='아이템 파밍 + 레벨업 멀티플레이';$('go').textContent='PLAY';$('join').style.display='none';c.focus()}};ws.onclose=()=>{$('status').textContent='DISCONNECTED'}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(e.code==='Space')e.preventDefault();if(!ws||ws.readyState!==1)return;if(k==='q')ws.send(JSON.stringify({t:'bomb'}));if(k==='e')ws.send(JSON.stringify({t:'potion'}));if(k==='r')ws.send(JSON.stringify({t:'laser'}))});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
function me(){return state.players.find(p=>p.id===myId)}function cam(){const p=me();if(!p)return{x:0,y:0};return{x:Math.max(0,Math.min(state.world.w-c.width,p.x-c.width/2)),y:Math.max(0,Math.min(state.world.h-c.height,p.y-c.height/2))}}
setInterval(()=>{if(!playing||!ws||ws.readyState!==1)return;const p=me(),ca=cam();if(!p)return;const angle=Math.atan2(mouse.y+ca.y-p.y,mouse.x+ca.x-p.x);ws.send(JSON.stringify({t:'input',keys:{w:!!keys.w,a:!!keys.a,s:!!keys.s,d:!!keys.d},angle,boost:!!keys[' ']}));if(mouse.down&&Date.now()-lastShoot>105){lastShoot=Date.now();ws.send(JSON.stringify({t:'shoot'}))}},50);
function poly(x,y,r,n,rot,fill,stroke){ctx.beginPath();for(let i=0;i<n;i++){let a=rot+i*Math.PI*2/n,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}
function drone(o,isMe=false,isBot=false){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.angle||0);const col=isBot?'#ff7b7b':isMe?'#68b7ff':'#7777df',edge=isBot?'#a84343':'#345d96';const form=o.form||1;ctx.fillStyle=isBot?'#c95c5c':isMe?'#6bb9ff':'#8d8df7';if(form===1){ctx.fillRect(10,-5,29,10)}else if(form===2){ctx.fillRect(9,-11,30,7);ctx.fillRect(9,4,30,7)}else if(form===3){ctx.beginPath();ctx.moveTo(8,-12);ctx.lineTo(39,-6);ctx.lineTo(39,6);ctx.lineTo(8,12);ctx.fill()}else{ctx.fillRect(8,-14,32,6);ctx.fillRect(8,-5,32,6);ctx.fillRect(8,4,32,6);ctx.fillRect(8,13,32,6)}poly(0,0,22,6,Math.PI/6,col,edge);ctx.restore();ctx.fillStyle='#222';ctx.font='12px Arial';ctx.textAlign='center';ctx.fillText((o.name||'BOT')+' Lv.'+(o.level||1),o.x,o.y-32);ctx.fillStyle='#ddd';ctx.fillRect(o.x-24,o.y+28,48,5);ctx.fillStyle='#ef5350';ctx.fillRect(o.x-24,o.y+28,48*Math.max(0,(o.hp||1)/(o.maxHp||100)),5)}
function cells(id,n){$(id).innerHTML=Array.from({length:10},(_,i)=>`<i class="cell ${i<n?'on':''}"></i>`).join('')}
function drawMini(){mctx.clearRect(0,0,170,110);mctx.fillStyle='#cfd4d9';mctx.fillRect(0,0,170,110);const sx=170/state.world.w,sy=110/state.world.h;for(const w of state.wilds){mctx.fillStyle='#66717e';mctx.fillRect(w.x*sx,w.y*sy,2,2)}for(const b of state.bots){mctx.fillStyle='#d9534f';mctx.fillRect(b.x*sx,b.y*sy,3,3)}for(const p of state.players){mctx.fillStyle=p.id===myId?'#1976d2':'#6554c0';mctx.beginPath();mctx.arc(p.x*sx,p.y*sy,p.id===myId?4:3,0,7);mctx.fill()}}
function draw(){requestAnimationFrame(draw);ctx.clearRect(0,0,c.width,c.height);const ca=cam(),self=me();ctx.save();ctx.translate(-ca.x,-ca.y);ctx.fillStyle='#e5e8ec';ctx.fillRect(0,0,state.world.w,state.world.h);ctx.strokeStyle='#ccd1d6';ctx.lineWidth=1;for(let x=0;x<state.world.w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,state.world.h);ctx.stroke()}for(let y=0;y<state.world.h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(state.world.w,y);ctx.stroke()}
for(const p of state.pickups){if(p.kind==='coin'){ctx.fillStyle='#f5bb32';ctx.beginPath();ctx.arc(p.x,p.y,10,0,7);ctx.fill();ctx.fillStyle='#fff2ad';ctx.beginPath();ctx.arc(p.x,p.y,5,0,7);ctx.fill()}else if(p.kind==='potion'){ctx.fillStyle='#42a5f5';ctx.fillRect(p.x-8,p.y-10,16,20);ctx.fillStyle='#e2f2ff';ctx.fillRect(p.x-5,p.y-15,10,6)}else if(p.kind==='bomb'){ctx.font='22px Arial';ctx.textAlign='center';ctx.fillText('💣',p.x,p.y+8)}else{ctx.strokeStyle='#f44336';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,10,0,7);ctx.stroke();ctx.fillStyle='#f44336';ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();ctx.font='10px Arial';ctx.fillText('LASER',p.x,p.y+23)}}
for(const w of state.wilds){if(w.type==='crawler'){poly(w.x,w.y,w.r,6,w.angle,'#7b8792','#505962')}else{ctx.fillStyle='#70c3b0';ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,7);ctx.fill();ctx.strokeStyle='#387b6d';ctx.stroke()}}
for(const b of state.bots)drone(b,false,true);for(const p of state.players)drone(p,p.id===myId,false);for(const b of state.bullets){ctx.fillStyle=b.effect?'#ffd54f':b.enemy?'#ff7676':'#fafafa';ctx.beginPath();ctx.arc(b.x,b.y,b.r||6,0,7);ctx.fill();ctx.strokeStyle='#888';ctx.stroke()}for(const g of state.grenades){ctx.font='18px Arial';ctx.fillText('💣',g.x,g.y)}
if(self&&self.laserActive){const L=1000;ctx.strokeStyle='rgba(255,30,30,.75)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(self.x,self.y);ctx.lineTo(self.x+Math.cos(self.angle)*L,self.y+Math.sin(self.angle)*L);ctx.stroke();ctx.fillStyle='#ff2020';ctx.beginPath();ctx.arc(self.x+Math.cos(self.angle)*220,self.y+Math.sin(self.angle)*220,3,0,7);ctx.fill()}
ctx.restore();
if(self){$('coins').textContent=self.coins;$('bombs').textContent=self.bombs;$('pots').textContent=self.potions;$('lasers').textContent=self.lasers;$('lvl').textContent=self.level;$('hp').style.width=Math.max(0,self.hp/self.maxHp*100)+'%';$('en').style.width=Math.max(0,self.energy)+'%';$('xp').style.width=Math.max(0,self.xp/self.nextXp*100)+'%';$('xptext').textContent=`${self.xp}/${self.nextXp}`;$('laserState').textContent=self.laserActive?'🔴 레이저 조준기 사용 중':'';cells('atk',Math.min(10,2+Math.floor((self.level-1)/2)));cells('rof',Math.min(10,2+Math.floor((self.level-1)/3)));cells('spd',Math.min(10,3+Math.floor((self.level-1)/4)))}
$('board').innerHTML=[...state.players,...state.bots].sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,8).map((q,i)=>`<div>${i+1}. ${q.name||q.id} <b>${q.score||0}</b></div>`).join('');drawMini()}
draw();
</script></body></html>
