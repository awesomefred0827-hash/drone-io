<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRONE.IO v7 Multiplayer</title><style>
html,body{margin:0;overflow:hidden;background:#f2f4f6;font-family:Arial,sans-serif}canvas{display:block}.panel{position:fixed;background:rgba(255,255,255,.92);border:1px solid #ccd2d8;border-radius:10px;padding:9px 11px;font-size:13px;color:#19202a;box-shadow:0 2px 8px #0001}.left{top:12px;left:12px}.right{top:12px;right:12px;min-width:170px}.bottom{bottom:12px;left:50%;transform:translateX(-50%)}#join{position:fixed;inset:0;display:grid;place-items:center;background:#e9edf1;z-index:10}#joinbox{background:white;padding:24px;border-radius:14px;border:1px solid #ccd2d8;text-align:center;width:min(360px,80vw)}input,button{font-size:16px;padding:10px;border-radius:8px;border:1px solid #bbc3cc}button{cursor:pointer;background:#202938;color:white}.bar{height:8px;background:#dce1e6;border-radius:4px;overflow:hidden;margin-top:4px}.fill{height:100%}.hp{background:#ef5350}.en{background:#42a5f5}.small{color:#68717c;font-size:12px}</style></head><body>
<div id="join"><div id="joinbox"><h2>DRONE.IO v7</h2><p>친구와 같은 서버에서 바로 싸우는 테스트 버전</p><input id="name" maxlength="16" placeholder="닉네임" value="Player"><button id="go">PLAY</button><p class="small">WASD 이동 · 마우스 조준 · 클릭 발사 · Q 폭탄 · E 포션 · SPACE 부스트</p></div></div>
<canvas id="c"></canvas><div class="panel left"><b id="status">연결 중...</b><div>🪙 <span id="coins">0</span>　💣 <span id="bombs">0</span>　🧪 <span id="pots">0</span></div><div>HP<div class="bar"><div id="hp" class="fill hp"></div></div></div><div>BOOST<div class="bar"><div id="en" class="fill en"></div></div></div></div><div class="panel right"><b>LEADERBOARD</b><div id="board"></div></div><div class="panel bottom">WASD · CLICK · Q 폭탄(30) · E 포션 · SPACE 부스트(최대 3초)</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');function rs(){c.width=innerWidth;c.height=innerHeight}addEventListener('resize',rs);rs();
let ws,myId=null,state={world:{w:2800,h:1800},players:[],bots:[],wilds:[],bullets:[],pickups:[],grenades:[]},keys={},mouse={x:innerWidth/2,y:innerHeight/2,down:false},playing=false,lastShoot=0;
const $=id=>document.getElementById(id);$('go').onclick=()=>{connect($('name').value||'Player');$('join').style.display='none';playing=true;c.focus()};
function connect(name){const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(proto+'://'+location.host);ws.onopen=()=>{$('status').textContent='ONLINE';ws.send(JSON.stringify({t:'name',name}))};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.t==='welcome'){myId=m.id;state.world=m.world}if(m.t==='state')state=m};ws.onclose=()=>{$('status').textContent='DISCONNECTED'}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(e.code==='Space')e.preventDefault();if(!ws||ws.readyState!==1)return;if(k==='q')ws.send(JSON.stringify({t:'bomb'}));if(k==='e')ws.send(JSON.stringify({t:'potion'}))});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
function me(){return state.players.find(p=>p.id===myId)}function cam(){const p=me();if(!p)return{x:0,y:0};return{x:Math.max(0,Math.min(state.world.w-c.width,p.x-c.width/2)),y:Math.max(0,Math.min(state.world.h-c.height,p.y-c.height/2))}}
setInterval(()=>{if(!playing||!ws||ws.readyState!==1)return;const p=me(),ca=cam();if(!p)return;const angle=Math.atan2(mouse.y+ca.y-p.y,mouse.x+ca.x-p.x);ws.send(JSON.stringify({t:'input',keys:{w:!!keys.w,a:!!keys.a,s:!!keys.s,d:!!keys.d},angle,boost:!!keys[' ']}));if(mouse.down&&Date.now()-lastShoot>120){lastShoot=Date.now();ws.send(JSON.stringify({t:'shoot'}))}},50);
function poly(x,y,r,n,rot,fill,stroke){ctx.beginPath();for(let i=0;i<n;i++){let a=rot+i*Math.PI*2/n,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}
function drone(o,isMe=false,isBot=false){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.angle||0);ctx.fillStyle=isBot?'#c95c5c':isMe?'#6bb9ff':'#8d8df7';ctx.beginPath();ctx.moveTo(10,-8);ctx.lineTo(38,-5);ctx.lineTo(38,5);ctx.lineTo(10,8);ctx.closePath();ctx.fill();poly(0,0,22,6,Math.PI/6,isBot?'#ff7b7b':isMe?'#68b7ff':'#7777df',isBot?'#a84343':'#345d96');ctx.restore();ctx.fillStyle='#222';ctx.font='12px Arial';ctx.textAlign='center';ctx.fillText(o.name||'BOT',o.x,o.y-32);ctx.fillStyle='#ddd';ctx.fillRect(o.x-24,o.y+28,48,5);ctx.fillStyle='#ef5350';ctx.fillRect(o.x-24,o.y+28,48*Math.max(0,(o.hp||1)/(o.maxHp||100)),5)}
function draw(){requestAnimationFrame(draw);ctx.clearRect(0,0,c.width,c.height);const ca=cam();ctx.save();ctx.translate(-ca.x,-ca.y);ctx.fillStyle='#e5e8ec';ctx.fillRect(0,0,state.world.w,state.world.h);ctx.strokeStyle='#ccd1d6';ctx.lineWidth=1;for(let x=0;x<state.world.w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,state.world.h);ctx.stroke()}for(let y=0;y<state.world.h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(state.world.w,y);ctx.stroke()}
for(const p of state.pickups){if(p.kind==='coin'){ctx.fillStyle='#f5bb32';ctx.beginPath();ctx.arc(p.x,p.y,10,0,7);ctx.fill();ctx.fillStyle='#fff2ad';ctx.beginPath();ctx.arc(p.x,p.y,5,0,7);ctx.fill()}else if(p.kind==='potion'){ctx.fillStyle='#42a5f5';ctx.fillRect(p.x-8,p.y-10,16,20);ctx.fillStyle='#e2f2ff';ctx.fillRect(p.x-5,p.y-15,10,6)}else{ctx.font='22px Arial';ctx.textAlign='center';ctx.fillText('💣',p.x,p.y+8)}}
for(const w of state.wilds){if(w.type==='crawler'){poly(w.x,w.y,w.r,6,w.angle,'#7b8792','#505962');ctx.fillStyle='#4b545c';for(let i=0;i<3;i++){let a=w.angle+i*2.09;ctx.fillRect(w.x+Math.cos(a)*18-5,w.y+Math.sin(a)*18-5,10,10)}}else{ctx.fillStyle='#70c3b0';ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,7);ctx.fill();ctx.strokeStyle='#387b6d';ctx.stroke()}}
for(const b of state.bots)drone(b,false,true);for(const p of state.players)drone(p,p.id===myId,false);for(const b of state.bullets){ctx.fillStyle=b.enemy?'#ff7676':'#fafafa';ctx.beginPath();ctx.arc(b.x,b.y,6,0,7);ctx.fill();ctx.strokeStyle='#888';ctx.stroke()}for(const g of state.grenades){ctx.font='18px Arial';ctx.fillText('💣',g.x,g.y)}ctx.restore();
const p=me();if(p){$('coins').textContent=p.coins;$('bombs').textContent=p.bombs;$('pots').textContent=p.potions;$('hp').style.width=Math.max(0,p.hp/p.maxHp*100)+'%';$('en').style.width=Math.max(0,p.energy)+'%'}$('board').innerHTML=[...state.players,...state.bots].sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,8).map((q,i)=>`<div>${i+1}. ${q.name||q.id} <b>${q.score||0}</b></div>`).join('')}
draw();
</script></body></html>
